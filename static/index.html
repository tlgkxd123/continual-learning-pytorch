<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOAR LLM</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0d;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #333;
    --text: #e8e8e8;
    --text-muted: #888;
    --accent: #7c6bff;
    --accent-hover: #9585ff;
    --user-bg: #2a2a3d;
    --assistant-bg: #1a1a1a;
    --radius: 12px;
  }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 820px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
  header h1 span { color: var(--accent); }
  .badge { font-size: 10px; background: var(--accent); color: #fff; padding: 2px 7px; border-radius: 6px; margin-left: 8px; vertical-align: middle; font-weight: 500; }

  .header-controls { display: flex; gap: 8px; align-items: center; }

  .mode-toggle { display: flex; background: var(--surface2); border-radius: 8px; padding: 2px; }
  .mode-toggle button {
    background: none; border: none; color: var(--text-muted); padding: 6px 14px;
    font-size: 13px; border-radius: 6px; cursor: pointer; transition: all 0.2s; font-family: inherit;
  }
  .mode-toggle button.active { background: var(--accent); color: #fff; }

  .btn-clear {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted);
    padding: 6px 14px; font-size: 13px; border-radius: 8px; cursor: pointer; transition: all 0.2s; font-family: inherit;
  }
  .btn-clear:hover { border-color: var(--text-muted); color: var(--text); }

  #messages {
    flex: 1; overflow-y: auto; padding: 20px; display: flex;
    flex-direction: column; gap: 12px; scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .message { display: flex; gap: 12px; max-width: 100%; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .message.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px; height: 32px; border-radius: 8px; display: flex;
    align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; font-weight: 600;
  }
  .message.user .avatar { background: var(--accent); color: #fff; }
  .message.assistant .avatar { background: var(--surface2); color: var(--accent); }

  .bubble {
    padding: 12px 16px; border-radius: var(--radius); line-height: 1.6;
    font-size: 14px; max-width: 75%; white-space: pre-wrap; word-break: break-word;
  }
  .message.user .bubble { background: var(--user-bg); border-bottom-right-radius: 4px; }
  .message.assistant .bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

  .bubble img.chat-image {
    max-width: 100%; max-height: 300px; border-radius: 8px; margin: 8px 0 4px;
    display: block; object-fit: contain;
  }

  .empty-state {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; color: var(--text-muted);
  }
  .empty-state .logo { font-size: 48px; font-weight: 700; color: var(--accent); opacity: 0.3; }
  .empty-state p { font-size: 14px; }

  .typing-indicator { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing-indicator span {
    width: 7px; height: 7px; background: var(--text-muted); border-radius: 50%; animation: bounce 1.2s infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

  .settings-row {
    display: flex; gap: 16px; padding: 8px 20px; border-bottom: 1px solid var(--border);
    flex-shrink: 0; align-items: center; flex-wrap: wrap;
  }
  .setting { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
  .setting label { white-space: nowrap; }
  .setting input {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 4px 8px; font-size: 12px; font-family: inherit;
  }
  .setting input[type="number"] { width: 64px; }
  .setting input[type="text"] { width: 220px; }

  .input-area { padding: 16px 20px 20px; flex-shrink: 0; }

  /* Image preview strip */
  .image-preview-strip {
    display: flex; gap: 8px; padding: 0 20px 8px; flex-shrink: 0; flex-wrap: wrap;
  }
  .image-preview-strip:empty { display: none; }
  .img-thumb-wrap {
    position: relative; width: 72px; height: 72px; border-radius: 10px; overflow: hidden;
    border: 1px solid var(--border);
  }
  .img-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .img-thumb-wrap .remove-btn {
    position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%;
    background: rgba(0,0,0,0.7); color: #fff; border: none; font-size: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }

  .input-wrapper {
    display: flex; align-items: flex-end; gap: 10px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px; transition: border-color 0.2s;
  }
  .input-wrapper:focus-within { border-color: var(--accent); }

  #input {
    flex: 1; background: transparent; border: none; outline: none; color: var(--text);
    font-size: 14px; font-family: inherit; line-height: 1.5; resize: none; max-height: 160px; min-height: 24px;
  }
  #input::placeholder { color: var(--text-muted); }

  .img-btn, .send-btn {
    width: 36px; height: 36px; border-radius: 10px; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s;
  }
  .img-btn { background: var(--surface2); color: var(--text-muted); }
  .img-btn:hover { background: var(--border); color: var(--text); }
  .send-btn { background: var(--accent); color: #fff; }
  .send-btn:hover { background: var(--accent-hover); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .img-btn svg, .send-btn svg { width: 18px; height: 18px; }

  .footer-note { text-align: center; font-size: 11px; color: var(--text-muted); padding: 0 20px 12px; flex-shrink: 0; }

  #file-input { display: none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><span>SOAR</span> LLM <span class="badge">omni</span></h1>
    <div class="header-controls">
      <div class="mode-toggle">
        <button id="btn-chat" class="active" onclick="setMode('chat')">Chat</button>
        <button id="btn-complete" onclick="setMode('complete')">Complete</button>
      </div>
      <button class="btn-clear" onclick="clearChat()">Clear</button>
    </div>
  </header>

  <div class="settings-row">
    <div class="setting">
      <label>System:</label>
      <input type="text" id="system-prompt" value="You are a helpful assistant." />
    </div>
    <div class="setting">
      <label>Temp:</label>
      <input type="number" id="temperature" value="0.7" min="0" max="2" step="0.1" />
    </div>
    <div class="setting">
      <label>Max tokens:</label>
      <input type="number" id="max-tokens" value="200" min="1" max="1024" step="1" />
    </div>
  </div>

  <div id="messages">
    <div class="empty-state" id="empty-state">
      <div class="logo">S</div>
      <p>Send a message or image to start</p>
    </div>
  </div>

  <div class="image-preview-strip" id="image-preview"></div>

  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="input" rows="1" placeholder="Type a message..." autofocus></textarea>
      <input type="file" id="file-input" accept="image/*" multiple />
      <button class="img-btn" onclick="document.getElementById('file-input').click()" title="Attach image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      </button>
      <button class="send-btn" id="send-btn" onclick="send()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
  <div class="footer-note">Qwen3.5-0.8B Omnimodal &middot; Text + Vision &middot; UltraChat SFT</div>
</div>

<script>
let mode = 'chat';
let chatHistory = [];   // [{role, content: string | [{type,text?,image?}]}]
let pendingImages = [];  // [{dataUrl, base64}]
let generating = false;

const $msgs   = document.getElementById('messages');
const $input  = document.getElementById('input');
const $send   = document.getElementById('send-btn');
const $empty  = document.getElementById('empty-state');
const $imgPre = document.getElementById('image-preview');
const $file   = document.getElementById('file-input');

function setMode(m) {
  mode = m;
  document.getElementById('btn-chat').classList.toggle('active', m === 'chat');
  document.getElementById('btn-complete').classList.toggle('active', m === 'complete');
  clearChat();
}

function clearChat() {
  chatHistory = [];
  pendingImages = [];
  $msgs.innerHTML = '';
  $msgs.appendChild($empty);
  $empty.style.display = 'flex';
  renderPreviews();
}

/* Image handling */
$file.addEventListener('change', function() {
  for (const f of this.files) {
    const reader = new FileReader();
    reader.onload = e => {
      const dataUrl = e.target.result;
      const base64 = dataUrl.split(',')[1];
      pendingImages.push({ dataUrl, base64 });
      renderPreviews();
    };
    reader.readAsDataURL(f);
  }
  this.value = '';
});

function renderPreviews() {
  $imgPre.innerHTML = '';
  pendingImages.forEach((img, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'img-thumb-wrap';
    wrap.innerHTML = `<img src="${img.dataUrl}" /><button class="remove-btn" onclick="removeImage(${i})">&times;</button>`;
    $imgPre.appendChild(wrap);
  });
}

function removeImage(i) {
  pendingImages.splice(i, 1);
  renderPreviews();
}

/* Messages */
function addMessage(role, textContent, imageDataUrls) {
  $empty.style.display = 'none';
  const div = document.createElement('div');
  div.className = `message ${role}`;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? 'U' : 'S';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (imageDataUrls && imageDataUrls.length) {
    imageDataUrls.forEach(url => {
      const img = document.createElement('img');
      img.className = 'chat-image';
      img.src = url;
      bubble.appendChild(img);
    });
  }
  if (textContent) {
    const span = document.createElement('span');
    span.textContent = textContent;
    bubble.appendChild(span);
  }
  div.appendChild(avatar);
  div.appendChild(bubble);
  $msgs.appendChild(div);
  $msgs.scrollTop = $msgs.scrollHeight;
  return bubble;
}

function addTyping() {
  $empty.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'message assistant';
  div.id = 'typing-msg';
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = 'S';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
  div.appendChild(avatar);
  div.appendChild(bubble);
  $msgs.appendChild(div);
  $msgs.scrollTop = $msgs.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-msg');
  if (el) el.remove();
}

$input.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 160) + 'px';
});

$input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

/* Paste image from clipboard */
$input.addEventListener('paste', function(e) {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      const file = item.getAsFile();
      const reader = new FileReader();
      reader.onload = ev => {
        pendingImages.push({ dataUrl: ev.target.result, base64: ev.target.result.split(',')[1] });
        renderPreviews();
      };
      reader.readAsDataURL(file);
    }
  }
});

async function send() {
  const text = $input.value.trim();
  const images = [...pendingImages];
  if ((!text && !images.length) || generating) return;

  generating = true;
  $send.disabled = true;

  const temp = parseFloat(document.getElementById('temperature').value) || 0.7;
  const maxTok = parseInt(document.getElementById('max-tokens').value) || 200;
  const system = document.getElementById('system-prompt').value.trim();

  const imageDataUrls = images.map(i => i.dataUrl);
  addMessage('user', text, imageDataUrls);
  $input.value = '';
  $input.style.height = 'auto';
  pendingImages = [];
  renderPreviews();
  addTyping();

  if (mode === 'chat') {
    const contentParts = [];
    images.forEach(img => contentParts.push({ type: 'image', image: img.base64 }));
    if (text) contentParts.push({ type: 'text', text });
    chatHistory.push({ role: 'user', content: contentParts.length === 1 && contentParts[0].type === 'text' ? text : contentParts });

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: chatHistory, temperature: temp, max_tokens: maxTok, system })
      });
      const data = await res.json();
      removeTyping();
      const reply = data.response || '(empty response)';
      addMessage('assistant', reply);
      chatHistory.push({ role: 'assistant', content: reply });
    } catch (e) {
      removeTyping();
      addMessage('assistant', 'Error: ' + e.message);
    }
  } else {
    try {
      const res = await fetch('/api/complete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: text, temperature: temp, max_tokens: maxTok })
      });
      const data = await res.json();
      removeTyping();
      addMessage('assistant', data.response || '(empty response)');
    } catch (e) {
      removeTyping();
      addMessage('assistant', 'Error: ' + e.message);
    }
  }

  generating = false;
  $send.disabled = false;
  $input.focus();
}
</script>
</body>
</html>
