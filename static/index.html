<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOAR LLM</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0d;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #333;
    --text: #e8e8e8;
    --text-muted: #888;
    --accent: #7c6bff;
    --accent-hover: #9585ff;
    --user-bg: #2a2a3d;
    --assistant-bg: #1a1a1a;
    --radius: 12px;
  }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 820px;
    margin: 0 auto;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }

  header h1 span { color: var(--accent); }

  .header-controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .mode-toggle {
    display: flex;
    background: var(--surface2);
    border-radius: 8px;
    padding: 2px;
  }

  .mode-toggle button {
    background: none;
    border: none;
    color: var(--text-muted);
    padding: 6px 14px;
    font-size: 13px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }

  .mode-toggle button.active {
    background: var(--accent);
    color: #fff;
  }

  .btn-clear {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 14px;
    font-size: 13px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }

  .btn-clear:hover { border-color: var(--text-muted); color: var(--text); }

  /* Messages */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .message {
    display: flex;
    gap: 12px;
    max-width: 100%;
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .message.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    font-weight: 600;
  }

  .message.user .avatar { background: var(--accent); color: #fff; }
  .message.assistant .avatar { background: var(--surface2); color: var(--accent); }

  .bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.6;
    font-size: 14px;
    max-width: 75%;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .message.user .bubble { background: var(--user-bg); border-bottom-right-radius: 4px; }
  .message.assistant .bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--text-muted);
  }

  .empty-state .logo {
    font-size: 48px;
    font-weight: 700;
    color: var(--accent);
    opacity: 0.3;
  }

  .empty-state p { font-size: 14px; }

  .typing-indicator {
    display: inline-flex;
    gap: 4px;
    padding: 4px 0;
  }

  .typing-indicator span {
    width: 7px;
    height: 7px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }

  .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  /* Settings panel */
  .settings-row {
    display: flex;
    gap: 16px;
    padding: 8px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    align-items: center;
    flex-wrap: wrap;
  }

  .setting {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .setting label { white-space: nowrap; }

  .setting input, .setting textarea {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
    font-family: inherit;
    width: auto;
  }

  .setting input[type="number"] { width: 64px; }
  .setting input[type="text"] { width: 220px; }
  .status-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    border-radius: 999px;
    padding: 4px 10px;
    color: var(--text-muted);
    font-size: 11px;
  }
  .status-chip.ok { border-color: #4ade80; color: #4ade80; }
  .status-chip.warn { border-color: #f59e0b; color: #f59e0b; }

  /* Input area */
  .input-area {
    padding: 16px 20px 20px;
    flex-shrink: 0;
  }

  .input-wrapper {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 14px;
    transition: border-color 0.2s;
  }

  .input-wrapper:focus-within { border-color: var(--accent); }

  #input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    line-height: 1.5;
    resize: none;
    max-height: 160px;
    min-height: 24px;
  }

  #input::placeholder { color: var(--text-muted); }

  .send-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s, opacity 0.2s;
  }

  .send-btn:hover { background: var(--accent-hover); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .send-btn svg { width: 18px; height: 18px; }

  .remember-btn {
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-muted);
    border-radius: 10px;
    height: 36px;
    padding: 0 10px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .remember-btn:hover { color: var(--text); border-color: var(--text-muted); }

  .footer-note {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    padding: 0 20px 12px;
    flex-shrink: 0;
  }

  /* TTT status bar */
  .ttt-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 20px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-muted);
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  .ttt-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
    transition: background 0.4s;
  }

  .ttt-dot.active { background: #4ade80; }

  .ttt-toggle {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 3px 10px;
    font-size: 11px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    margin-left: auto;
  }

  .ttt-toggle.on {
    border-color: #4ade80;
    color: #4ade80;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><span>SOAR</span> LLM</h1>
    <div class="header-controls">
      <div class="mode-toggle">
        <button id="btn-chat" class="active" onclick="setMode('chat')">Chat</button>
        <button id="btn-complete" onclick="setMode('complete')">Complete</button>
      </div>
      <button class="btn-clear" onclick="clearChat()">Clear</button>
    </div>
  </header>

  <div class="settings-row">
    <div class="setting">
      <label>System:</label>
      <input type="text" id="system-prompt" value="You are a helpful assistant." />
    </div>
    <div class="setting">
      <label>Temp:</label>
      <input type="number" id="temperature" value="0.7" min="0" max="2" step="0.1" />
    </div>
    <div class="setting">
      <label>Max tokens:</label>
      <input type="number" id="max-tokens" value="128" min="1" max="1024" step="1" />
    </div>
    <span class="status-chip" id="model-status">Loading model…</span>
    <span class="status-chip" id="memory-status">Memory idle</span>
  </div>

  <div id="messages">
    <div class="empty-state" id="empty-state">
      <div class="logo">S</div>
      <p>Send a message to start a conversation</p>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="input" rows="1" placeholder="Type a message..." autofocus></textarea>
      <button class="remember-btn" id="remember-btn" onclick="rememberInput()">Add to Weights</button>
      <button class="send-btn" id="send-btn" onclick="send()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
  <div class="footer-note" id="footer-note">Qwen3.5-0.8B &middot; preparing model…</div>

  <!-- Continuous TTT status bar -->
  <div class="ttt-bar" id="ttt-bar">
    <div class="ttt-dot" id="ttt-dot"></div>
    <span id="ttt-label">Continuous Learning: <b id="ttt-state">off</b></span>
    <span id="ttt-stats" style="display:none">
      &nbsp;|&nbsp; steps: <b id="ttt-steps">0</b>
      &nbsp;loss: <b id="ttt-loss">—</b>
      &nbsp;replay: <b id="ttt-replay">0</b> tok
      &nbsp;lr: <b id="ttt-lr">—</b>
    </span>
    <button class="ttt-toggle" id="ttt-btn" onclick="toggleTTT()">Enable</button>
  </div>
</div>

<script>
let mode = 'chat';
let chatHistory = [];
let generating = false;
let tttEnabled = false;
let tttPollTimer = null;
let currentAbortController = null;
const TTT_POLL_MS = 3000; // milliseconds between TTT status polls

const $msgs   = document.getElementById('messages');
const $input  = document.getElementById('input');
const $send   = document.getElementById('send-btn');
const $empty  = document.getElementById('empty-state');

function setMode(m) {
  mode = m;
  document.getElementById('btn-chat').classList.toggle('active', m === 'chat');
  document.getElementById('btn-complete').classList.toggle('active', m === 'complete');
  clearChat();
}

function clearChat() {
  chatHistory = [];
  $msgs.innerHTML = '';
  $msgs.appendChild($empty);
  $empty.style.display = 'flex';
}

function addMessage(role, content) {
  $empty.style.display = 'none';
  const div = document.createElement('div');
  div.className = `message ${role}`;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? 'U' : 'S';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;
  div.appendChild(avatar);
  div.appendChild(bubble);
  $msgs.appendChild(div);
  $msgs.scrollTop = $msgs.scrollHeight;
  return bubble;
}

function addTyping() {
  $empty.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'message assistant';
  div.id = 'typing-msg';
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = 'S';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
  div.appendChild(avatar);
  div.appendChild(bubble);
  $msgs.appendChild(div);
  $msgs.scrollTop = $msgs.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-msg');
  if (el) el.remove();
}

function setMemoryStatus(text, kind = '') {
  const el = document.getElementById('memory-status');
  el.textContent = text;
  el.classList.remove('ok', 'warn');
  if (kind) el.classList.add(kind);
}

$input.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 160) + 'px';
});

$input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

// ---- TTT helpers ------------------------------------------------------------

function toggleTTT() {
  tttEnabled = !tttEnabled;
  const btn = document.getElementById('ttt-btn');
  const dot = document.getElementById('ttt-dot');
  const stateEl = document.getElementById('ttt-state');
  const statsEl = document.getElementById('ttt-stats');
  btn.textContent = tttEnabled ? 'Disable' : 'Enable';
  btn.classList.toggle('on', tttEnabled);
  stateEl.textContent = tttEnabled ? 'on' : 'off';
  dot.classList.toggle('active', tttEnabled);
  statsEl.style.display = tttEnabled ? '' : 'none';
  if (tttEnabled) {
    startTTTPoll();
  } else {
    stopTTTPoll();
  }
}

async function fetchTTTStatus() {
  try {
    const res = await fetch('/api/ttt_status');
    if (!res.ok) return;
    const d = await res.json();
    if (!d.enabled) return;
    document.getElementById('ttt-steps').textContent = d.step_count ?? 0;
    document.getElementById('ttt-loss').textContent =
      d.running_loss != null ? d.running_loss.toFixed(4) : '—';
    document.getElementById('ttt-replay').textContent = d.replay_tokens ?? 0;
    document.getElementById('ttt-lr').textContent =
      d.ttt_lr != null ? d.ttt_lr.toExponential(1) : '—';
    // Flash the dot on each poll to show activity.
    const dot = document.getElementById('ttt-dot');
    dot.classList.remove('active');
    setTimeout(() => dot.classList.add('active'), 80);
  } catch (_) { /* ignore */ }
}

function startTTTPoll() {
  if (tttPollTimer) return;
  tttPollTimer = setInterval(fetchTTTStatus, TTT_POLL_MS);
}

function stopTTTPoll() {
  if (tttPollTimer) { clearInterval(tttPollTimer); tttPollTimer = null; }
}

async function streamToBubble(endpoint, payload, bubble) {
  if (currentAbortController) currentAbortController.abort();
  currentAbortController = new AbortController();
  const response = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
    signal: currentAbortController.signal
  });
  if (!response.ok || !response.body) {
    throw new Error(`HTTP ${response.status}`);
  }

  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let fullText = '';
  let donePayload = null;

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const events = buffer.split('\n\n');
    buffer = events.pop() || '';
    for (const evt of events) {
      const line = evt.split('\n').find(l => l.startsWith('data: '));
      if (!line) continue;
      const data = JSON.parse(line.slice(6));
      if (data.type === 'token') {
        fullText += data.text || '';
        bubble.textContent = fullText;
        $msgs.scrollTop = $msgs.scrollHeight;
      } else if (data.type === 'done') {
        donePayload = data;
      } else if (data.type === 'error') {
        throw new Error(data.error || 'stream error');
      }
    }
  }

  if (!donePayload) donePayload = { response: fullText };
  return donePayload;
}

async function rememberInput() {
  const current = $input.value.trim();
  let fallback = '';
  for (let i = chatHistory.length - 1; i >= 0; i -= 1) {
    if (chatHistory[i].role === 'user') {
      fallback = chatHistory[i].content || '';
      break;
    }
  }
  const text = current || fallback;
  if (!text) {
    setMemoryStatus('Nothing to add', 'warn');
    return;
  }
  setMemoryStatus('Adding to weights…');
  try {
    const res = await fetch('/api/ttt/remember', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, save: true })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'failed to save memory');
    setMemoryStatus(`Added ✓ step ${data.ttt_step || 0}`, 'ok');
    if (tttEnabled) fetchTTTStatus();
  } catch (e) {
    setMemoryStatus(`Failed: ${e.message}`, 'warn');
  }
}

async function initHealth() {
  try {
    const res = await fetch('/api/health');
    const data = await res.json();
    const status = document.getElementById('model-status');
    status.textContent = data.model_loaded ? `Model ready on ${data.device}` : 'Model loading…';
    status.classList.toggle('ok', !!data.model_loaded);
    document.getElementById('footer-note').textContent =
      `Qwen3.5-0.8B · ${data.device || 'cpu'} inference · streaming on`;
  } catch (err) {
    console.error('Health check failed', err);
  }
}

// ---- Main send --------------------------------------------------------------

async function send() {
  const text = $input.value.trim();
  if (!text || generating) return;

  generating = true;
  $send.disabled = true;

  const temp = parseFloat(document.getElementById('temperature').value) || 0.7;
  const maxTok = parseInt(document.getElementById('max-tokens').value) || 128;
  const system = document.getElementById('system-prompt').value.trim();

  if (mode === 'chat') {
    addMessage('user', text);
    chatHistory.push({ role: 'user', content: text });
    $input.value = '';
    $input.style.height = 'auto';
    const bubble = addMessage('assistant', '');

    try {
      const data = await streamToBubble('/api/chat/stream', {
        messages: chatHistory,
        temperature: temp,
        max_tokens: maxTok,
        system: system,
        enable_ttt: tttEnabled
      }, bubble);
      const reply = data.response || '(empty response)';
      bubble.textContent = reply;
      chatHistory.push({ role: 'assistant', content: reply });
      if (tttEnabled) fetchTTTStatus();
    } catch (e) {
      addMessage('assistant', 'Error: ' + e.message);
    }
  } else {
    addMessage('user', text);
    $input.value = '';
    $input.style.height = 'auto';
    const bubble = addMessage('assistant', '');

    try {
      const data = await streamToBubble('/api/complete/stream', {
        prompt: text,
        temperature: temp,
        max_tokens: maxTok,
        enable_ttt: tttEnabled
      }, bubble);
      bubble.textContent = data.response || '(empty response)';
      if (tttEnabled) fetchTTTStatus();
    } catch (e) {
      addMessage('assistant', 'Error: ' + e.message);
    }
  }

  generating = false;
  $send.disabled = false;
  $input.focus();
}

initHealth();
</script>
</body>
</html>
